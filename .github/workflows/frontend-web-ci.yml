name: Finance Pro Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Utilisé par le déploiement web réel (Vercel/Netlify) — ici juste
          # pour vérifier que le build ne casse pas avec une vraie valeur.
          VITE_API_BASE_URL: https://ton-backend.onrender.com/api
